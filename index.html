    />
    <style>
      /* Painted before the bundle executes so the first frame is branded, never blank. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f7f6f2;
      }
      #boot span {
        display: block;
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: rgba(11, 45, 91, 0.15);
        animation: bootPulse 1.1s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><span></span></div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem 1.5rem; font-family: system-ui, sans-serif; text-align: center">
        <h1 style="color: #0b2d5b">Beyond Now</h1>
        <p style="color: #1f2937">
          Today Is Not The Whole Story. Please enable JavaScript to view this website.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
